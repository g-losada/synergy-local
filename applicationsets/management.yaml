apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: management
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/g-losada/synergy-local.git
        revision: HEAD
        files:
          - path: "management/**/config.yaml"

  template:
    metadata:
      name: "{{ .appName }}"
      namespace: argocd
      labels:
        appset: "management"
      finalizers:
        - resources-finalizer.argocd.argoproj.io

    spec:
      project: platform

      source:
        repoURL: https://github.com/g-losada/synergy-local.git
        targetRevision: HEAD
        path: "{{ .sourcePath }}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .destinationNamespace }}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        retry:
          limit: 2
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - ServerSideApply=true