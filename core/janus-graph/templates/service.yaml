apiVersion: v1
kind: Service
metadata:
  name: {{ include "janus-graph.fullname" . }}
  labels:
    {{- include "janus-graph.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: gremlin
      port: {{ .Values.service.port }}
      targetPort: gremlin
      protocol: TCP
  selector:
    {{- include "janus-graph.selectorLabels" . | nindent 4 }}
