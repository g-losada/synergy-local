{{- if .Values.cqlCredentials.create }}
{{- $root := . }}
{{- range .Values.cqlCredentials.namespaces }}
{{- if ne . $root.Release.Namespace }}
---
# The Secret is rendered into a namespace other than this Application's, so that
# namespace must exist first: ArgoCD's CreateNamespace=true only creates the
# Application's own destination namespace (k8ssandra).
#
# Never pruned or deleted: the janus-graph Application is its real owner, and a
# prune from here would take JanusGraph down with it.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    {{- include "k8ssandra.labels" $root | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    helm.sh/resource-policy: keep
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $root.Values.cqlCredentials.secretName }}
  namespace: {{ . }}
  labels:
    {{- include "k8ssandra.labels" $root | nindent 4 }}
  annotations:
    # Must exist before the K8ssandraCluster (wave 1) that references it.
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  username: {{ $root.Values.cqlCredentials.username | quote }}
  password: {{ required "cqlCredentials.password is required when cqlCredentials.create=true" $root.Values.cqlCredentials.password | quote }}
{{- end }}
{{- end }}
