{{- if and .Values.gatewayApi.enabled .Values.gatewayApi.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayApi.gatewayClass.name }}
spec:
  controllerName: {{ .Values.gatewayApi.gatewayClass.controllerName }}
  {{- if and .Values.gatewayApi.envoyProxy.create .Values.gatewayApi.envoyProxy.name }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Values.gatewayApi.envoyProxy.name }}
    namespace: {{ default .Release.Namespace .Values.gatewayApi.envoyProxy.namespace }}
  {{- end }}
{{- end }}