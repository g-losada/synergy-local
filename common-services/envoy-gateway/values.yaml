gateway-helm:
  service:
    type: ClusterIP
    externalTrafficPolicy: Cluster


  deployment:
    replicas: 1
    envoyGateway:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1024Mi

  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
      provider:
        type: Kubernetes
      logging:
        level:
          default: info

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 1

  topologyInjector:
    enabled: true

  createNamespace: true

gatewayApi:
  enabled: true
  envoyProxy:
    create: true
    name: envoy-proxy
    spec:
      provider:
        type: Kubernetes
        kubernetes:
          envoyService:
            type: LoadBalancer
            annotations:
              lb.stackit.cloud/internal-lb: "true"

  gatewayClass:
    create: true
    name: envoy-gateway-class
    controllerName: gateway.envoyproxy.io/gatewayclass-controller

  gateway:
    create: true
    name: envoy-gateway
    namespace: envoy-gateway
    gatewayClassName: envoy-gateway-class
    listeners:
      - name: http
        protocol: HTTP
        port: 80
        hostname: ""
        allowedRoutes:
          namespaces:
            from: All
      - name: https
        protocol: HTTPS
        port: 443
        hostname: ""
        tls:
          mode: Terminate
          certificateRefs:
            - kind: Secret
              name: gateway-cert
        allowedRoutes:
          namespaces:
            from: All
    #  - name: ssh
    #    protocol: TCP
    #    port: 22
    #    allowedRoutes:
    #      namespaces:
    #        from: All

  httpRoutes:
    - create: true
      name: harbor-route
      namespace: envoy-gateway
      parentRefs:
        - name: envoy-gateway
          sectionName: http
        - name: envoy-gateway
          sectionName: https
      hostnames:
        - harbor.synergy.runs.onstackit.cloud
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: harbor
              port: 80
              namespace: harbor
              weight: 1

    - create: true
      name: argocd-route
      namespace: envoy-gateway
      parentRefs:
        - name: envoy-gateway
          sectionName: http
        - name: envoy-gateway
          sectionName: https
      hostnames:
        - argocd.synergy.runs.onstackit.cloud
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: argocd-server
              port: 80
              namespace: argocd
              weight: 1
        
