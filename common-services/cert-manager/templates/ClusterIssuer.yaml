{{- if .Values.clusterIssuer.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
spec:
  acme:
    email: {{ .Values.clusterIssuer.email }}
    server: {{ .Values.clusterIssuer.server }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.privateKeySecretRef }}
    solvers:
      - dns01:
          webhook:
            solverName: {{ .Values.clusterIssuer.webhook.solverName }}
            groupName: {{ .Values.clusterIssuer.webhook.groupName }}
            config:
              projectId: {{ .Values.clusterIssuer.webhook.config.projectId }}
{{- end }}